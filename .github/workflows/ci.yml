name: CI

on:
  # Branches only. A version tag runs this same check through release.yml,
  # which waits on it before publishing anything.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test, build
    uses: xraph/workflows/.github/workflows/node-ci.yml@v1
    with:
      # test:ci is turbo test two packages at a time, not turbo's default of
      # ten. Every package's vitest starts its own workers, and ten at once on
      # a 4-vCPU runner pushed chronicle tests that take a second or two
      # locally past 20s.
      scripts: '["typecheck","lint","test:ci","build"]'
      # example-next's proxy route needs a forge target to build. Nothing is
      # listening in CI, so the URL only has to parse. turbo.json declares it
      # on the build task, or turbo would strip it before next build runs.
      env-vars: |
        FORGE_DASHBOARD_URL=http://localhost:7901/dashboard
