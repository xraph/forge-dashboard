name: Release

# Push a vX.Y.Z tag and, once CI passes on that commit, everything releases at
# X.Y.Z: every public package under packages/ goes to npm, and the dashboard
# shell goes to the GitHub release as forge-dashboard-shell-vX.Y.Z.tar.gz.
#
# Dispatch it by hand to rehearse. dry-run stays on unless you switch it off,
# and a dry run packs and checks every package and the shell tarball without
# publishing either.
#
# The package list comes from scripts/release-packages.mjs, so a new package
# ships with the next release unless its package.json says "private": true.
# Internal peer ranges are `workspace:^`, which pnpm packs as a caret range on
# the release version, so every plugin's peers follow the version you tag.
#
# A real publish needs an NPM_TOKEN secret with publish rights on @forge-go.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and check everything without publishing to npm or creating a release'
        type: boolean
        default: true
      version:
        description: 'Version to stamp, without a leading v. Empty uses the version in apps/shell/package.json.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Resolve version and packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry-run: ${{ steps.resolve.outputs.dry_run }}
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # A separate job because the expression language has no string replace:
      # the leading v can't be trimmed from the tag inline, and npm-publish.yml
      # refuses a version that still has one.
      - name: Resolve
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
            dry_run=false
          else
            version="${INPUT_VERSION#v}"
            if [ -z "$version" ]; then
              version=$(node -p "require('./apps/shell/package.json').version")
            fi
            dry_run="${INPUT_DRY_RUN:-true}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::version must be semver without a leading v, got '$version'"
            exit 1
          fi

          packages=$(node scripts/release-packages.mjs)

          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

          {
            if [ "$dry_run" = true ]; then
              echo "### Dry run at \`$version\`"
            else
              echo "### Releasing \`$version\`"
            fi
            printf '%s' "$packages" | jq -r '.[] | "- `\(.)`"'
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish to npm
    needs: [ci, prepare]
    uses: xraph/workflows/.github/workflows/npm-publish.yml@v1
    with:
      package-manager: pnpm
      packages: ${{ needs.prepare.outputs.packages }}
      version: ${{ needs.prepare.outputs.version }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      # Every package publishes its TypeScript source as it is, through its
      # "exports" and "files" fields, so there is nothing to build first.
      build-script: ''
      # A re-run after a publish that died half way picks up where it stopped.
      skip-existing: true
      node-version: '24'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Forge's own release CI fetches this tarball by building its URL from a
  # version string alone, forge-dashboard-shell-v<version>.tar.gz, with no
  # lookup against this repo. Nothing here may make that name depend on a
  # commit hash or a build ID, or that fetch breaks. The Go side embeds the
  # unpacked files with a plain `//go:embed dist`, and nothing built is ever
  # committed to the forge repo.
  shell:
    name: Release the dashboard shell
    needs: [prepare, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Reads the version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @forge-go/dashboard-shell build

      - name: Pack tarball
        id: pack
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NAME="forge-dashboard-shell-v${VERSION}.tar.gz"

          # `-C apps/shell/dist .` packs the build output with paths that start
          # at index.html and assets/, not at dist/index.html. The Go side
          # unpacks this straight over a fixed `//go:embed dist` directory. An
          # extra dist/ level doesn't fail that build, it just makes every
          # embedded asset 404 at runtime, which is far worse than a build
          # error. Don't "simplify" this to `tar -czf "$NAME" apps/shell/dist`.
          #
          # --exclude='*.map' keeps sourcemaps out even though the build makes
          # none today. The 11MB embed this pipeline replaced was 6MB of them.
          tar -czf "$NAME" --exclude='*.map' -C apps/shell/dist .

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify archive layout
        shell: bash
        env:
          FILE: ${{ steps.pack.outputs.name }}
        run: |
          set -euo pipefail

          # The listing is captured first instead of piping tar into grep -q.
          # grep -q exits on its first match and closes the pipe, tar then dies
          # on SIGPIPE, and under pipefail that reads a good archive as broken.
          LIST="$(tar -tzf "$FILE")"

          if ! printf '%s\n' "$LIST" | grep -qx './index.html'; then
            echo "::error::index.html is not at the archive root, check for an extra dist/ wrapper"
            exit 1
          fi

          if printf '%s\n' "$LIST" | grep -q '\.map$'; then
            echo "::error::sourcemap(s) present in the archive despite --exclude"
            exit 1
          fi

      - name: Attach to GitHub release
        if: needs.prepare.outputs.dry-run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: ${{ steps.pack.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
